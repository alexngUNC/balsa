name: Linux build and smoke tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk2.0-dev libgmp-dev guile-3.0 graphviz
      - name: Build and install
        shell: bash
        run: |
          report_failure() {
            echo '::group::Build failure details'
            tail -80 "$RUNNER_TEMP/balsa-build.log"
            echo '::endgroup::'
            detail=$(grep -E 'error:|multiple definition|undefined reference|No rule to make target' "$RUNNER_TEMP/balsa-build.log" | head -8 || true)
            detail=${detail:-$(tail -12 "$RUNNER_TEMP/balsa-build.log")}
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\r'/'%0D'}
            detail=${detail//$'\n'/'%0A'}
            echo "::error::$detail"
            exit 1
          }
          CFLAGS="-O2 -g -std=gnu17" ./configure --prefix="$RUNNER_TEMP/balsa" 2>&1 | tee "$RUNNER_TEMP/balsa-build.log" || report_failure
          make -j"$(nproc)" 2>&1 | tee -a "$RUNNER_TEMP/balsa-build.log" || report_failure
          make install 2>&1 | tee -a "$RUNNER_TEMP/balsa-build.log" || report_failure
          echo "$RUNNER_TEMP/balsa/bin" >> "$GITHUB_PATH"
      - name: Build standalone Scintilla GTK library
        run: make -C extra/scintilla-wrapper/scintilla/gtk GTK2=1 all
      - name: Compile, simulate, and render examples
        env:
          GUILE_AUTO_COMPILE: '0'
        run: |
          check() {
            local label=$1
            shift
            if ! timeout -k 5s 45s "$@" > "$RUNNER_TEMP/balsa-example.log" 2>&1; then
              cat "$RUNNER_TEMP/balsa-example.log"
              echo "::error::$label failed or timed out"
              exit 1
            fi
            cat "$RUNNER_TEMP/balsa-example.log"
          }
          for example in tutorial/buffer1a tutorial/count10b tutorial/ssem program-counter; do
            (
              cd "examples/$example"
              check "$example Makefile generation" balsa-make-makefile -b -p .
              check "$example compilation" make
              check "$example graph generation" make ps
              test -s "$(find . -maxdepth 1 -name '*.ps' -print -quit)"
              if [ -x ./test.sh ]; then check "$example simulation" ./test.sh; fi
            )
          done
          (
            cd examples/tutorial/count10b
            check "count10b Verilog generation" balsa-netlist -X example/four_b_rb -n verilog count10b.breeze
            test -s count10b.v
          )
